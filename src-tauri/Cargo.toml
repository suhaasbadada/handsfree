[package]
name = "handsfree"
version = "0.1.1"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = { version = "0.16", features = ["metal"] }
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "time"] }

[profile.release]
lto = "thin"
# Do not strip proc-macro dylibs: recent macOS dyld rejects the LINKEDIT
# layout emitted by Rust's symbol stripper. The bundled app is still optimized.
strip = false
