name: Windows beta candidate (paused, manual only)

on:
  # Retained for explicit portability work; current product development is Mac-only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install stable x64 Rust and verification tools
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy --component rust-docs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          . ./scripts/windows-env.ps1
          cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          7z i
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Native tests, lint, notices and NSIS candidate
        run: ./scripts/windows-package.ps1
      - name: Verify actual CPU transcription without microphone access
        run: |
          . ./scripts/windows-env.ps1
          $model = Join-Path $env:RUNNER_TEMP 'handsfree-test-base.en.bin'
          Invoke-WebRequest -Uri 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin' -OutFile $model
          $expected = 'a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002'
          if ((Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Test model checksum mismatch.' }
          $env:HANDSFREE_TEST_MODEL = $model
          cargo test --manifest-path src-tauri/Cargo.toml --locked --target $env:CARGO_BUILD_TARGET real_model_pipeline_smoke -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath $model
      - name: Require clean candidate source after all checks
        run: |
          $dirty = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($dirty) { throw "Unexpected post-build source changes: $dirty" }
      - uses: actions/upload-artifact@v7
        with:
          name: Windows-installer-x64-${{ github.sha }}
          path: release/windows-x64/
          # Controlled candidate output only; registry notices include .license_template.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      # No release upload, secrets, code signing, app launch, or installed-app update.
