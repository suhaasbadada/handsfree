name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    # Current standard macos-15 runner is arm64. Assert rather than silently
    # validating a different architecture if GitHub changes its mapping.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Confirm supported CI host
        run: test "$(uname -m)" = arm64
      - name: Install Rust checking tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      # No app launch, signing identities, microphone, model download, or release
      # publishing. Native test harnesses exercise policy with synthetic data.
