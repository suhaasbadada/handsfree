name: Feature request
description: Suggest an improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your workflow without private text or recordings. Current focus is Mac-only (Apple Silicon, macOS 14+); Windows is paused and Linux is unsupported, with no port commitments.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior and alternatives
    validations:
      required: true
