name: Feature request
description: Suggest an improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your workflow without private text or recordings. Windows and Linux are planned, with no promised dates.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior and alternatives
    validations:
      required: true
