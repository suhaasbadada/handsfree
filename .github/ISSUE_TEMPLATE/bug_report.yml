name: Bug report
description: Report a problem with the Apple Silicon Mac beta (macOS 14+)
body:
  - type: markdown
    attributes:
      value: |
        Do not attach recordings, transcripts, credentials, or personal settings. Redact diagnostics before sharing. For a security issue, read SECURITY.md instead of opening a public report.
  - type: input
    id: version
    attributes:
      label: HandsFree version and source
      placeholder: App version, Mac release tag, or source commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - Historical release / unsupported platform (not currently supported)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS version, CPU/chip, affected app/version, and microphone type
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result, and actual result
      description: Use invented text. Include permission/shortcut status if relevant.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics (optional)
      description: Review every line first. Do not upload recordings or transcripts.
